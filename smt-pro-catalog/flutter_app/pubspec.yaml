name: daraliraq
description: DaralIraq — Multi-platform catalog (Android, iOS, Web)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^5.0.2

  # Media
  video_player: ^2.8.6
  chewie: ^1.8.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  photo_view: ^0.14.0

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.1.0
  badges: ^3.1.2
  fluttertoast: ^8.2.8
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Charts
  fl_chart: ^0.68.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # Push notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.2

  # Barcode scanner
  mobile_scanner: ^5.2.3

  # Offline cache
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
